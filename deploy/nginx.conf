# Внутренняя раздача статики фронтенда (за прокси Caddy).
# TLS и gzip делает Caddy на входе; здесь — SPA-fallback и кэш ассетов.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: любой путь → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ассеты Vite содержат хеш в имени → можно кэшировать «навсегда»
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html не кэшируем, чтобы деплой подхватывался сразу
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
