# HONA Core 2.0 — dev-инфраструктура (§23.6). НЕ production: production-compose и Caddy — Phase 23.
#
#   docker compose -f docker-compose.dev.yml up -d        postgres, redis, minio, minio-init
#   docker compose -f docker-compose.dev.yml --profile app up -d --build   + образы api и worker
#
# Все порты привязаны только к 127.0.0.1 и не пересекаются с легаси-compose.
# Значения берутся из .env (см. .env.example); compose читает его сам, shell его не source-ит.
name: hona-core-dev

x-postgres-passwords: &postgres-passwords
  HONA_MIGRATE_PASSWORD: ${HONA_MIGRATE_PASSWORD:?set HONA_MIGRATE_PASSWORD in .env}
  HONA_APP_PASSWORD: ${HONA_APP_PASSWORD:?set HONA_APP_PASSWORD in .env}
  HONA_READONLY_PASSWORD: ${HONA_READONLY_PASSWORD:?set HONA_READONLY_PASSWORD in .env}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      <<: *postgres-passwords
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: hona
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 01-roles.sh выполняется при первом создании тома: роли hona_migrate / hona_app / hona_readonly
      - ./packages/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d hona']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '127.0.0.1:6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # MinIO больше не публикует образы на Docker Hub; официальный реестр — quay.io.
    # Образ переопределяется MINIO_IMAGE (см. docs/development.md).
    image: ${MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z}
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      # CORS bucket — только APP_ORIGIN (§12.1)
      MINIO_API_CORS_ALLOW_ORIGIN: ${APP_ORIGIN:?set APP_ORIGIN in .env}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - miniodata:/data

  minio-init:
    image: ${MC_IMAGE:-quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z}
    depends_on:
      - minio
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in .env}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    volumes:
      - ./docker/minio-init.sh:/minio-init.sh:ro
    entrypoint: ['/bin/sh', '/minio-init.sh']
    restart: 'no'

  # --- профиль app: образы api и worker поверх той же инфраструктуры ---
  api:
    profiles: ['app']
    image: hona-core-dev/api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      APP_ORIGIN: ${APP_ORIGIN}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: 'false'
      DATABASE_URL: postgres://hona_app:${HONA_APP_PASSWORD}@postgres:5432/hona
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    ports:
      - '127.0.0.1:3100:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    profiles: ['app']
    image: hona-core-dev/worker
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://hona_app:${HONA_APP_PASSWORD}@postgres:5432/hona
      WORKER_ID: worker-docker
      WORKER_HEALTH_PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
