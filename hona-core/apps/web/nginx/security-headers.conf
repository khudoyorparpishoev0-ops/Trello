# Заголовки §14.3 (nginx не наследует add_header в location — подключается в каждом).
# connect-src/img-src для files.<domain> и wss: добавятся с файлами (Phase 10) и realtime (Phase 11).
add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data: blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header X-Frame-Options "DENY" always;
